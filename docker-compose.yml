# ECS Fleet Maintenance & Inventory Management System — full stack.
#   cp .env.example .env   &&   docker compose up -d --build
# Set RUN_DEMO_SEED=true (non-production only) to load demo data on first boot.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecs_fleet}
      POSTGRES_USER: ${POSTGRES_USER:-ecs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecs_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecs} -d ${POSTGRES_DB:-ecs_fleet}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies SQL migrations in order (and optional demo seed), then exits.
  migrator:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-ecs}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ecs_password}
      PGDATABASE: ${POSTGRES_DB:-ecs_fleet}
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-false}
    volumes:
      - ./database:/database:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/db-migrate.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-ecs_fleet};Username=${POSTGRES_USER:-ecs};Password=${POSTGRES_PASSWORD:-ecs_password}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ECS.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-ECS.Client}
      FileStorage__RootPath: /app/storage
      Reporting__Company__Name: ${REPORT_COMPANY_NAME:-ECS Europe Cargo Service}
      Cors__Origins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
    volumes:
      - reportstorage:/app/storage
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-5080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Optional DB admin UI (dev convenience). Reach it at http://localhost:8081
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    profiles: ["tools"]

volumes:
  pgdata:
  reportstorage:
